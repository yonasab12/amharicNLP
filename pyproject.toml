[project]
name = "amharicNLP"
version = "2.0.0"
# PEP 621 expects `description` to be a short, single-line summary (it maps
# to the "Summary" metadata field); the multi-paragraph pitch belongs in the
# README, which is already wired up as the long description below.
description = "A dependency-light, rule-based NLP and text-preprocessing toolkit for Amharic."

readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
  { name = "Yonas Abebe", email = "abebeyonas88@gmail.com" }
]

keywords = [
    "Amharic",
    "NLP",
    "Amharic NLP",
    "Amharic preprocessing",
    "Amharic tokenizer",
    "Amharic stopwords",
    "Amharic sentiment analysis",
    "Amharic text processing",
    "Ethiopian NLP",
    "tokenizer",
    "normalizer",
    "sentiment analysis",
    "amharicnlp",
    "amharicprocessing",
    "amharicnltk",
    "tokinization",   # keep common misspelling for search
    "amharicstopword"
]


classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License"
]


dependencies = [
    # BPE subword tokenizer over decomposed fidel, for feeding Amharic text
    # into an LLM/embedding model. Small (~10MB), no heavy transitive deps
    # (no torch), so it stays in the base install unlike the neural extra.
    # Not our own work -- by Sefineh Tesfa: https://github.com/sefineh-ai/Amharic-Tokenizer
    "amharic-tokenizer>=0.2.6",
]

[project.optional-dependencies]
# amharicNLP itself stays dependency-light (the rule-based
# tokenizer/normalizer/stemmer/cleaner are pure Python + stdlib, and the
# subword tokenizer above is small with no heavy transitive deps). Install
# this extra only if you want amharicNLP.neural or AmharicNLP(neural=True)
# (sentiment/NER/embeddings via small pretrained Amharic transformer models).
neural = [
    "transformers>=4.30",
    "torch",
]
# Text-to-speech (facebook/mms-tts-amh) and speech-to-text
# (agkphysics/wav2vec2-large-xlsr-53-amharic). Kept separate from `neural`
# since audio I/O deps (scipy, librosa) are a different weight class from
# just running a text model, and most users won't need both.
speech = [
    "transformers>=4.33",  # 4.33+ for VitsModel (TTS)
    "torch",
    "scipy",
    "librosa",
]
# For amharicNLP.dataset_prep.AmharicDatasetPreprocessor.load() -- loading
# a dataset from the Hugging Face Hub to preprocess (e.g. voice/ASR/TTS
# training data, an LLM pretraining corpus, a sentiment dataset).
datasets = [
    "datasets>=2.14",
]
# Optional framework integrations. None of these are required: amharicNLP
# prepares data and hands it over, so the developer installs only the
# framework they actually train in. Each is imported lazily at the point of
# use (see amharicNLP/_optional.py), and a missing one raises an error that
# names the exact pip command rather than a bare ModuleNotFoundError.
pandas = [
    "pandas",
]
parquet = [
    "pandas",
    "pyarrow",
]
torch = [
    "torch",
]
tensorflow = [
    "tensorflow",
]
sklearn = [
    "scikit-learn",
]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
amharicnlp = "amharicNLP.cli:main"

[project.urls]
Homepage = "https://github.com/yonasab12/amharicNLP"
Repository = "https://github.com/yonasab12/amharicNLP"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Previously listed "data/*.txt", "resources/wordnet/*.json" and
# "resources/*.json" -- none of those paths exist in this package, so those
# entries matched nothing and were dead configuration. The actual data
# files that exist and are used at import time (amharic_stopword.py,
# data_lemma.py) are plain .py modules, not data files, so they're already
# included as regular package code and don't need a package-data entry.
amharicNLP = []

